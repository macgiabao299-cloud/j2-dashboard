<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J2 Dashboard - Dark Mode</title>
    <style>
        /* === BIẾN MÀU CHO DARK MODE === */
        :root {
            --bg-color: #121212;        
            --panel-bg: #1e1e1e;        
            --text-main: #e0e0e0;       
            --text-muted: #9e9e9e;      
            --border-color: #333333;    
            --accent-color: #4fc3f7;    
        }

        body { 
            margin: 0; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; 
        }

        .panel { 
            display: none; 
            width: 100vw; 
            height: 100vh; 
            box-sizing: border-box; 
            padding: 20px 40px; 
            background: var(--panel-bg);
        }
        .panel.active { display: block; }

        /* ================= 1. GIAO DIỆN MAIL ================= */
        .mail-header {
            font-size: 20px; font-weight: bold; margin-bottom: 15px;
            padding-bottom: 10px; border-bottom: 2px solid var(--accent-color);
            display: inline-block; color: var(--text-main);
        }
        .mail-table { width: 100%; border-collapse: collapse; font-size: 16px; }
        .mail-table tr { border-bottom: 1px solid var(--border-color); height: 55px; }
        .mail-table tr:nth-child(even) { background-color: #252525; }
        .mail-table td { padding: 10px; vertical-align: middle; }
        .mail-sender { width: 250px; font-weight: bold; color: var(--accent-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mail-subject { color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mail-date { width: 100px; text-align: right; font-weight: bold; color: var(--text-muted); font-size: 14px; }
        .loading { font-size: 18px; color: var(--text-muted); font-style: italic; }

        /* ================= 2. GIAO DIỆN THỜI KHÓA BIỂU (TABLE) ================= */
        .schedule-layout {
            display: flex;
            gap: 30px;
            height: 100%;
        }
        
        /* Cột trái: Chứa bảng TKB */
        .schedule-main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .schedule-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .schedule-header h2 { margin: 0; color: var(--accent-color); font-size: 24px; }
        .schedule-header .clock { font-size: 24px; font-weight: bold; font-family: monospace; color: var(--text-main); }

        /* Bảng TKB */
        .timetable {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed; /* Giúp các cột đều nhau */
            text-align: center;
        }
        .timetable th, .timetable td {
            border: 1px solid #444; /* Viền kẻ bảng */
            padding: 8px;
            font-size: 15px;
            word-wrap: break-word;
        }
        .timetable th {
            background-color: #2a2a2a;
            color: var(--accent-color);
            font-weight: bold;
            height: 40px;
        }
        /* Cột Buổi (Sáng/Chiều) */
        .timetable td.session {
            background-color: #252525;
            font-weight: bold;
            writing-mode: vertical-rl; /* Chữ xoay dọc */
            transform: rotate(180deg);
            width: 40px;
            color: var(--text-muted);
        }
        
        /* Cột của ngày hôm nay (Sẽ được JS thêm class 'today') */
        .timetable .today {
            background-color: rgba(79, 195, 247, 0.15); /* Xanh nhạt */
            border: 2px solid var(--accent-color); /* Viền xanh nổi bật */
            color: #fff;
        }
        .timetable th.today {
            background-color: var(--accent-color);
            color: #000;
        }

        /* Cột phải: Logo trường */
        .school-logo {
            width: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 20px;
        }
        .school-logo img {
            width: 100%;
            max-width: 180px;
            border-radius: 12px;
            object-fit: contain;
        }
        .school-name {
            margin-top: 15px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: var(--text-muted);
        }

        /* Lời nhắc nhở dưới bảng */
        .reminder-box {
            margin-top: 20px;
            background: #2a2a2a;
            border-left: 6px solid #ffeb3b;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .reminder-title { font-size: 20px; font-weight: bold; color: #ffeb3b; white-space: nowrap; }
        .reminder-items { display: flex; gap: 25px; font-size: 18px; }
        .reminder-items span { display: flex; align-items: center; gap: 8px; }

        /* ================= 3. THÔNG TIN CLASSROOM ================= */
        #panel-info { padding: 30px; }
        .info-list { margin-top: 20px; }
        .info-item { border-bottom: 1px solid var(--border-color); padding: 15px 0; }
        .info-meta { font-size: 14px; color: var(--accent-color); margin-bottom: 5px; }
        .info-text { font-size: 18px; line-height: 1.5; color: var(--text-main); }
    </style>
</head>
<body>

    <!-- Màn hình 1: Hộp thư (20 giây) -->
    <div id="panel-mail" class="panel active">
        <div class="mail-header">📬 Hộp thư đến</div>
        <table class="mail-table">
            <tbody id="mail-list">
                <tr><td colspan="3" class="loading">Đang tải email...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Màn hình 2: Thời khóa biểu (10 giây) -->
    <div id="panel-schedule" class="panel">
        <div class="schedule-layout">
            
            <!-- BÊN TRÁI: BẢNG TKB VÀ LỜI NHẮC -->
            <div class="schedule-main">
                <div class="schedule-header">
                    <h2>📚 THỜI KHÓA BIỂU</h2>
                    <div class="clock" id="live-clock">00:00</div>
                </div>

                <table class="timetable" id="timetable-grid">
                    <thead>
                        <tr>
                            <th style="width: 40px;"></th>
                            <th id="col-T2">Thứ 2</th>
                            <th id="col-T3">Thứ 3</th>
                            <th id="col-T4">Thứ 4</th>
                            <th id="col-T5">Thứ 5</th>
                            <th id="col-T6">Thứ 6</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- SẼ ĐƯỢC ĐỔ BẰNG JS -->
                    </tbody>
                </table>

                <!-- Lời nhắc nhở nằm dưới bảng -->
                <div class="reminder-box">
                    <div class="reminder-title">⚠️ NHẮC NHỞ:</div>
                    <div class="reminder-items">
                        <span>👓 Kính cận</span>
                        <span>🎧 Tai nghe</span>
                        <span>💧 Bình nước</span>
                    </div>
                </div>
            </div>

            <!-- BÊN PHẢI: LOGO TRƯỜNG -->
            <div class="school-logo">
                <!-- THAY LINK ẢNH LOGO TRƯỜNG CỦA BẠN VÀO ĐÂY -->
                <img src="https://cdn.haitrieu.com/wp-content/uploads/2023/01/Logo-Truong-Cao-dang-Ky-thuat-Cao-Thang.png" alt="Logo Trường">
                <div class="school-name">CTTC<br></div>
            </div>

        </div>
    </div>

    <!-- Màn hình 3: Thông báo Classroom (10 giây) -->
    <div id="panel-info" class="panel">
        <h2 style="color: var(--accent-color); margin-top: 0;">📢 Thông báo Classroom</h2>
        <div id="classroom-list" class="info-list">
            <div class="loading">Đang tải thông báo...</div>
        </div>
    </div>

    <script>
        // ==== CẤU HÌNH CHUYỂN ĐỔI ====
        const panels = ['panel-mail', 'panel-schedule', 'panel-info'];
        const durations = [20000, 15000, 10000]; // Tăng thời gian xem TKB lên 15s cho kịp đọc
        let currentIndex = 0;

        function showPanel(index) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(panels[index]).classList.add('active');
            if(panels[index] === 'panel-mail') window.scrollTo(0,0);
        }

        function cycle() {
            showPanel(currentIndex);
            const nextIndex = (currentIndex + 1) % panels.length;
            setTimeout(() => {
                currentIndex = nextIndex;
                cycle();
            }, durations[currentIndex]);
        }

        // ==== ĐỒNG HỒ THỜI GIAN THỰC ====
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', hour12: false });
            document.getElementById('live-clock').innerText = timeStr;
            
            highlightToday(now.getDay());
        }
        setInterval(updateClock, 1000);

        // ==== TÔ MÀU CỘT NGÀY HÔM NAY ====
        function highlightToday(dayOfWeek) {
            // Xóa các màu cũ
            for(let i = 2; i <= 6; i++) {
                document.getElementById('col-T' + i).classList.remove('today');
                document.querySelectorAll('.td-T' + i).forEach(el => el.classList.remove('today'));
            }

            // Nếu là T2 -> T6 (Thứ 2 đến Thứ 6)
            if (dayOfWeek >= 1 && dayOfWeek <= 5) {
                const dayId = 'T' + dayOfWeek;
                document.getElementById('col-' + dayId).classList.add('today');
                document.querySelectorAll('.td-' + dayId).forEach(el => el.classList.add('today'));
            }
        }

        // =========================================================
        // BẠN SỬA THỜI KHÓA BIỂU CỦA BẠN Ở ĐÂY (GIỐNG EXCEL)
        // Mỗi ngày chia làm 4 tiết (4 dòng). 
        // Nếu môn nào trống, để dấu ""
        // =========================================================
        const scheduleData = {
            T2: ["SHCN", "N.N LẬP TRÌNH", "N.N LẬP TRÌNH", "N.N LẬP TRÌNH", "N.N LẬP TRÌNH", "THỂ DỤC", "THỂ DỤC", "THỂ DỤC"],
            T3: ["MD-SCLR MÁY TÍNH", "MD-SCLR MÁY TÍNH", "MD-SCLR MÁY TÍNH", "TH-N.N LẬP TRÌNH", "TH-N.N LẬP TRÌNH", "TH-N.N LẬP TRÌNH", "", ""],
            T4: ["MẠNG MÁY TÍNH", "MẠNG MÁY TÍNH", "MẠNG MÁY TÍNH", "MẠNG MÁY TÍNH", "TIN HỌC VĂN PHÒNG", "TIN HỌC VĂN PHÒNG", "", ""],
            T5: ["TH-MẠNG MÁY TÍNH", "TH-MẠNG MÁY TÍNH", "TH-MẠNG MÁY TÍNH", "TH-SCLR MÁY TÍNH", "TH-SCLR MÁY TÍNH", "", "", ""],
            T6: ["TH-TIN HỌC VĂN PHÒNG", "TH-TIN HỌC VĂN PHÒNG", "TH-TIN HỌC VĂN PHÒNG", "", "", "", "", ""]
        };

        function renderTable() {
            const tbody = document.querySelector('#timetable-grid tbody');
            let html = '';

            // Dựa theo ảnh, ta chia làm 2 buổi: Sáng (6 tiết) và Chiều (4 tiết). Tổng cộng 10 dòng.
            // Bạn có thể sửa số lượng tiết ở đây
            const morningPeriods = 6; 
            const afternoonPeriods = 4;

            // --- VẼ BUỔI SÁNG ---
            for (let i = 0; i < morningPeriods; i++) {
                html += `<tr>`;
                // Cột Buổi (chỉ gộp ô ở dòng đầu tiên)
                if (i === 0) {
                    html += `<td class="session" rowspan="${morningPeriods}">SÁNG</td>`;
                }
                
                // Các cột Thứ
                ['T2', 'T3', 'T4', 'T5', 'T6'].forEach(day => {
                    const subject = scheduleData[day][i] || ''; // Lấy môn, nếu không có thì để trống
                    html += `<td class="td-${day}">${subject}</td>`;
                });
                html += `</tr>`;
            }

            // --- VẼ BUỔI CHIỀU ---
            for (let i = 0; i < afternoonPeriods; i++) {
                html += `<tr>`;
                if (i === 0) {
                    html += `<td class="session" rowspan="${afternoonPeriods}">CHIỀU</td>`;
                }
                
                ['T2', 'T3', 'T4', 'T5', 'T6'].forEach(day => {
                    // Lấy môn buổi chiều (tính từ vị trí tiếp theo của mảng)
                    const subject = scheduleData[day][i + morningPeriods] || ''; 
                    html += `<td class="td-${day}">${subject}</td>`;
                });
                html += `</tr>`;
            }

            tbody.innerHTML = html;
            
            // Gọi hàm tô màu sau khi bảng đã được vẽ xong
            updateClock();
        }
        
        renderTable(); // Chạy vẽ bảng

        // ==== LẤY DỮ LIỆU MAIL ====
        const MAIL_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJGbpHxopL9P75m2CFVABmlulrOpxGTHYjTQjjLiD52nr2zawn2H0iVwsddWa5HM4/exec"; // DÁN LINK VÀO ĐÂY

        async function fetchMails() {
            try {
                const response = await fetch(MAIL_SCRIPT_URL);
                const data = await response.json();
                const tbody = document.getElementById('mail-list');
                tbody.innerHTML = '';

                data.forEach(mail => {
                    const tr = document.createElement('tr');
                    let senderName = mail.sender.split('<')[0].replace(/"/g, '').trim();
                    if(senderName.length === 0) senderName = mail.sender;

                    tr.innerHTML = `
                        <td class="mail-sender">${senderName}</td>
                        <td class="mail-subject">${mail.subject}</td>
                        <td class="mail-date">${mail.date}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                document.getElementById('mail-list').innerHTML = '<tr><td colspan="3" class="loading">Lỗi tải dữ liệu mail.</td></tr>';
            }
        }

        // ==== LẤY DỮ LIỆU CLASSROOM ====
        const CLASSROOM_URL = "https://script.google.com/macros/s/AKfycbxcYatVESdKIOBdOOVjQ85uPhZhWn4jnqWktptY_L2gh1g6lwKPDJhtDUCqCy1pEnKe/exec"; // DÁN LINK VÀO ĐÂY

        async function fetchClassroom() {
            const container = document.getElementById('classroom-list');
            try {
                const res = await fetch(CLASSROOM_URL);
                const data = await res.json();

                if (data.length === 0) {
                    container.innerHTML = '<div class="loading">Không có thông báo mới.</div>';
                    return;
                }

                let html = '';
                data.forEach(item => {
                    html += `
                    <div class="info-item">
                        <div class="info-meta">${item.courseName} · ${item.time}</div>
                        <div class="info-text">${item.text.length > 100 ? item.text.substring(0, 100) + '...' : item.text}</div>
                    </div>`;
                });
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = '<div class="loading">Không tải được thông báo.</div>';
            }
        }

        // Khởi chạy
        fetchMails();
        fetchClassroom();
        cycle();
        
        setInterval(fetchMails, 5 * 60 * 1000); 
        setInterval(fetchClassroom, 10 * 60 * 1000); 
    </script>
</body>
</html>
