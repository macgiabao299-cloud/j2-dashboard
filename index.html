<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J2 Dashboard - Dark Mode</title>
    <style>
        /* === BIẾN MÀU CHO DARK MODE === */
        :root {
            --bg-color: #121212;        
            --panel-bg: #1e1e1e;        
            --text-main: #e0e0e0;       
            --text-muted: #9e9e9e;      
            --border-color: #333333;    
            --accent-color: #4fc3f7;    
        }

        body { 
            margin: 0; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; 
        }

        .panel { 
            display: none; 
            width: 100vw; 
            height: 100vh; 
            box-sizing: border-box; 
            padding: 20px 40px; 
            background: var(--panel-bg);
        }
        .panel.active { display: block; }

        /* ================= GIAO DIỆN MAIL (DARK MODE) ================= */
        .mail-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--accent-color);
            display: inline-block;
            color: var(--text-main);
        }
        .mail-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 16px;
        }
        .mail-table tr {
            border-bottom: 1px solid var(--border-color);
            height: 55px;
        }
        .mail-table tr:nth-child(even) { background-color: #252525; }
        .mail-table td { padding: 10px; vertical-align: middle; }
        .mail-sender { 
            width: 250px; 
            font-weight: bold; 
            color: var(--accent-color); 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis;
        }
        .mail-subject { 
            color: var(--text-main); 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis;
        }
        .mail-date { 
            width: 100px; 
            text-align: right; 
            font-weight: bold; 
            color: var(--text-muted); 
            font-size: 14px;
        }
        .loading { font-size: 18px; color: var(--text-muted); font-style: italic; }

        /* ================= GIAO DIỆN THỜI TIẾT TỰ VẼ ================= */
        .weather-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            padding: 0 50px;
        }
        .weather-current {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
        }
        .weather-temp {
            font-size: 90px;
            font-weight: bold;
            color: var(--text-main);
            margin: 0;
            line-height: 1;
        }
        .weather-desc {
            font-size: 28px;
            color: var(--accent-color);
            font-weight: bold;
        }
        .weather-details {
            font-size: 18px;
            color: var(--text-muted);
            margin-top: 10px;
        }
        .weather-forecast {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
        .forecast-card {
            background: #2a2a2a;
            padding: 20px 30px;
            border-radius: 12px;
            text-align: center;
            flex: 1;
        }
        .forecast-date { font-size: 18px; color: var(--text-muted); margin-bottom: 10px; }
        .forecast-temp { font-size: 24px; font-weight: bold; color: var(--text-main); }

        /* ================= THÔNG TIN KHÁC ================= */
        #panel-info { padding: 30px; }
        .info-list { margin-top: 20px; }
        .info-item { border-bottom: 1px solid var(--border-color); padding: 15px 0; }
        .info-meta { font-size: 14px; color: var(--accent-color); margin-bottom: 5px; }
        .info-text { font-size: 18px; line-height: 1.5; color: var(--text-main); }
    </style>
</head>
<body>

    <!-- Màn hình 1: Hộp thư (20 giây) -->
    <div id="panel-mail" class="panel active">
        <div class="mail-header">📬 Hộp thư đến</div>
        <table class="mail-table">
            <tbody id="mail-list">
                <tr><td colspan="3" class="loading">Đang tải email...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Màn hình 2: Thời tiết (10 giây) -->
    <div id="panel-weather" class="panel">
        <div class="weather-container" id="weather-data">
            <div class="loading">Đang tải thời tiết...</div>
        </div>
    </div>

    <!-- Màn hình 3: Thông báo Classroom (10 giây) -->
    <div id="panel-info" class="panel">
        <h2 style="color: var(--accent-color); margin-top: 0;">📢 Thông báo Classroom</h2>
        <div id="classroom-list" class="info-list">
            <div class="loading">Đang tải thông báo...</div>
        </div>
    </div>

    <script>
        // ==== CẤU HÌNH CHUYỂN ĐỔI ====
        const panels = ['panel-mail', 'panel-weather', 'panel-info'];
        const durations = [20000, 10000, 10000]; // 20s, 10s, 10s
        let currentIndex = 0;

        function showPanel(index) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(panels[index]).classList.add('active');
            if(panels[index] === 'panel-mail') window.scrollTo(0,0);
        }

        function cycle() {
            showPanel(currentIndex);
            const nextIndex = (currentIndex + 1) % panels.length;
            setTimeout(() => {
                currentIndex = nextIndex;
                cycle();
            }, durations[currentIndex]);
        }

        // ==== 1. LẤY DỮ LIỆU MAIL ====
        // DÁN URL WEB APP MAIL VÀO ĐÂY:
        const MAIL_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJGbpHxopL9P75m2CFVABmlulrOpxGTHYjTQjjLiD52nr2zawn2H0iVwsddWa5HM4/exec";

        async function fetchMails() {
            try {
                const response = await fetch(MAIL_SCRIPT_URL);
                const data = await response.json();
                const tbody = document.getElementById('mail-list');
                tbody.innerHTML = '';

                data.forEach(mail => {
                    const tr = document.createElement('tr');
                    let senderName = mail.sender.split('<')[0].replace(/"/g, '').trim();
                    if(senderName.length === 0) senderName = mail.sender;

                    tr.innerHTML = `
                        <td class="mail-sender">${senderName}</td>
                        <td class="mail-subject">${mail.subject}</td>
                        <td class="mail-date">${mail.date}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                document.getElementById('mail-list').innerHTML = '<tr><td colspan="3" class="loading">Lỗi tải dữ liệu mail.</td></tr>';
            }
        }

        // ==== 2. LẤY DỮ LIỆU THỜI TIẾT (OPEN-METEO API) ====
       async function fetchWeather() {
    const container = document.getElementById('weather-data');
    try {
        // wttr.in hỗ trợ trả về JSON, format=j1
        const res = await fetch("https://wttr.in/Ho+Chi+Minh?format=j1");
        const data = await res.json();
        const current = data.current_condition[0];
        
        container.innerHTML = `
            <div class="weather-current">
                <div>
                    <p class="weather-temp">${current.temp_C}°C</p>
                    <div class="weather-desc">${current.weatherDesc[0].value}</div>
                    <div class="weather-details">Độ ẩm: ${current.humidity}% | TP. Hồ Chí Minh</div>
                </div>
            </div>
        `;
    } catch (e) {
        container.innerHTML = '<div class="loading">Không tải được thời tiết (wttr.in).</div>';
    }
}

        // ==== 3. LẤY DỮ LIỆU CLASSROOM ====
        // DÁN URL WEB APP CLASSROOM VÀO ĐÂY:
        const CLASSROOM_URL = "https://script.google.com/macros/s/AKfycbxcYatVESdKIOBdOOVjQ85uPhZhWn4jnqWktptY_L2gh1g6lwKPDJhtDUCqCy1pEnKe/exec";

        async function fetchClassroom() {
            const container = document.getElementById('classroom-list');
            try {
                const res = await fetch(CLASSROOM_URL);
                const data = await res.json();

                if (data.length === 0) {
                    container.innerHTML = '<div class="loading">Không có thông báo mới.</div>';
                    return;
                }

                let html = '';
                data.forEach(item => {
                    html += `
                    <div class="info-item">
                        <div class="info-meta">${item.courseName} · ${item.time}</div>
                        <div class="info-text">${item.text.length > 100 ? item.text.substring(0, 100) + '...' : item.text}</div>
                    </div>`;
                });
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = '<div class="loading">Không tải được thông báo.</div>';
            }
        }

        // Khởi chạy các hàm
        fetchMails();
        fetchWeather();
        fetchClassroom();
        cycle();
        
        // Tự động làm mới dữ liệu
        setInterval(fetchMails, 5 * 60 * 1000); 
        setInterval(fetchWeather, 30 * 60 * 1000); 
        setInterval(fetchClassroom, 10 * 60 * 1000); 
    </script>
</body>
</html>
